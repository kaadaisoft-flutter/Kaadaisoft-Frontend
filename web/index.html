<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Poondurai Kaadai Kulam - Member Management System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kaadaikulam">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Poondurai Kaadai Kulam</title>
  <link rel="manifest" href="manifest.json">

  <!-- High-performance Preconnect & Async Font Loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  </noscript>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #171311;
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #2b231d 0%, #171311 75%, #0e0b0a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999999;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    #loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .logo-container {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 26px;
    }

    /* Ambient outer glow pulse */
    .logo-glow {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(197, 160, 40, 0.4) 0%, rgba(197, 160, 40, 0) 70%);
      animation: pulseGlow 2.8s ease-in-out infinite;
    }

    /* Outer rotating gold gradient ring */
    .logo-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      padding: 3px;
      background: conic-gradient(from 0deg, transparent 0%, #856d1a 25%, #C5A028 50%, #FFF2A7 75%, transparent 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: rotateRing 2.2s linear infinite;
    }

    /* Inner subtle counter-rotating ring */
    .logo-ring-inner {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px dashed rgba(197, 160, 40, 0.35);
      animation: rotateRingRev 12s linear infinite;
    }

    /* Central logo card */
    .logo-card {
      position: relative;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: #1e1915;
      padding: 5px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), inset 0 0 10px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 2;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      animation: breathe 3s ease-in-out infinite;
    }

    .title-tamil {
      font-size: 22px;
      font-weight: 700;
      color: #f7eedc;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    .title-en {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #c5a028;
      margin-bottom: 26px;
      text-align: center;
      opacity: 0.95;
      text-shadow: 0 0 10px rgba(197, 160, 40, 0.3);
    }

    /* Slim modern progress track */
    .progress-track {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
    }

    .progress-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -40%;
      width: 40%;
      background: linear-gradient(90deg, transparent 0%, #C5A028 50%, #FFF3B0 100%);
      border-radius: 999px;
      animation: shimmerBar 1.8s ease-in-out infinite;
      box-shadow: 0 0 12px rgba(255, 224, 130, 0.9);
    }

    .loading-status {
      margin-top: 14px;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: rgba(245, 238, 220, 0.65);
      animation: pulseStatus 2s ease-in-out infinite;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes rotateRingRev {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(0.96); }
      50% { opacity: 0.75; transform: scale(1.06); }
    }

    @keyframes shimmerBar {
      0% { left: -40%; width: 40%; }
      50% { width: 65%; }
      100% { left: 100%; width: 40%; }
    }

    @keyframes pulseStatus {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.95; }
    }
  </style>
</head>
<body>
  <!-- Animated Loading Screen -->
  <div id="loading-screen" aria-live="polite">
    <div class="logo-container">
      <div class="logo-glow"></div>
      <div class="logo-ring-inner"></div>
      <div class="logo-ring"></div>
      <div class="logo-card">
        <img class="logo-img" src="logo.png" alt="Poondurai Kaadai Kulam" />
      </div>
    </div>
    <div class="title-tamil">பூந்துறை காடை குலம்</div>
    <div class="title-en">Poondurai Kaadai Kulam</div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
    <div class="loading-status">Loading...</div>
  </div>

  <script>
    (function() {
      var dismissed = false;
      function dismissLoadingScreen() {
        if (dismissed) return;
        var screen = document.getElementById('loading-screen');
        if (!screen) return;
        dismissed = true;
        screen.classList.add('fade-out');
        setTimeout(function() {
          if (screen && screen.parentNode) {
            screen.parentNode.removeChild(screen);
          }
        }, 500);
      }

      window.dismissLoadingScreen = dismissLoadingScreen;

      // Primary: dismiss smoothly when Flutter renders its first frame
      window.addEventListener('flutter-first-frame', dismissLoadingScreen);

      // Fallback safety timeout (15s) in case of very slow connection so screen is never permanently stuck
      setTimeout(function() {
        dismissLoadingScreen();
      }, 15000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
